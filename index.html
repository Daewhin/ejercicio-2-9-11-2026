<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos Tecnológicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="text-center fw-bold mb-4">Catálogo Tecnológico</h2>
        <div class="row g-3">
            <!-- Producto 1 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <div>
                            <span class="badge bg-success mb-2">En Stock</span>
                            <h5 class="card-title">Mouse RGB 16k</h5>
                            <p class="fs-4 fw-bold text-success">$45.00</p>
                        </div>
                        <button class="btn btn-primary w-100 mt-auto">Comprar</button>
                    </div>
                </div>
            </div>
            <!-- Producto 2 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <div>
                            <span class="badge bg-success mb-2">En Stock</span>
                            <h5 class="card-title">Teclado Mecánico</h5>
                            <p class="fs-4 fw-bold text-success">$85.00</p>
                        </div>
                        <button class="btn btn-primary w-100 mt-auto">Comprar</button>
                    </div>
                </div>
            </div>
            <!-- Producto 3 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <div>
                            <span class="badge bg-warning text-dark mb-2">Pocas Unidades</span>
                            <h5 class="card-title">Audífonos 7.1</h5>
                            <p class="fs-4 fw-bold text-success">$65.00</p>
                        </div>
                        <button class="btn btn-primary w-100 mt-auto">Comprar</button>
                    </div>
                </div>
            </div>
            <!-- Producto 4 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <div>
                            <span class="badge bg-danger mb-2">Agotado</span>
                            <h5 class="card-title">Monitor 240Hz</h5>
                            <p class="fs-4 fw-bold text-success">$299.00</p>
                        </div>
                        <button class="btn btn-secondary w-100 mt-auto" disabled>Sin Stock</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
